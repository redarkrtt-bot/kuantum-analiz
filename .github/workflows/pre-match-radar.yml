name: Pre-Match Radar

on:
  schedule:
    - cron: "*/5 * * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pre-match-radar
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install -r requirements-goal-bot.txt

      - name: Validate Python syntax
        run: python -m py_compile prematch_radar.py

      - name: Run Pre-Match Radar
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python prematch_radar.py

      - name: Save pre-match state
        run: |
          git config user.name "goal-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prematch_state.json
          if git diff --cached --quiet; then
            echo "No pre-match state changes."
          else
            git commit -m "Update pre-match radar state"
            git push
          fi
