name: Goal Radar

on:
  schedule:
    - cron: "3,33 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: goal-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install -r requirements-goal-bot.txt

      - name: Validate Python syntax
        run: python -m py_compile goal_bot.py

      - name: Run Goal Radar
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python goal_bot.py

      - name: Save state
        if: always()
        run: |
          git config user.name "goal-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update goal radar state"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "State push denemesi $attempt başarısız; tekrar deneniyor..."
              sleep 2
            done
          fi
